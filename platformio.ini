[env:dfrobot_firebeetle2_esp32s3]
platform = espressif32
board = dfrobot_firebeetle2_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
	./lib/deploy
	; https://github.com/cdjq/DFRobot_AXP313A.git§
	; https://github.com/DFRobot/DFRobot_SHT
	https://github.com/DFRobot/DFRobot_SHT3x
	sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library @ ^1.0.4
	olikraus/U8g2@^2.34.22
	bblanchon/ArduinoJson@^7.0.0
lib_ignore = 
	Container_simple_inferencing
	magic_iot_inferencing
	materials_magic_container_inferencing
build_flags = 
	-DHAS_GNSS=1
	; Firmware version reported to the OTA server. BUMP THIS on every release you
	; want devices to pull. Server only sends an image when its version > this.
	; v7 (2026-07-27): depot/home path does a settings-only TCP poll before
	; sleep so web-app config changes apply without camera/ML/photo upload.
	; v8 (2026-07-27): operational window is now actually enforced — the gate
	; resolves the hour from modem CCLK, else an RTC clock persisted across deep
	; sleep, else a modem bring-up. Previously a cold boot skipped the gate and
	; ran a full camera+ML+upload job at any hour. Boot log prints "fw v8".
	-DFW_VERSION=10
	; GNSS power rail. 1 = MAX-M10S on permanent 3.3 V (jumper 3V1): firmware sends
	; UBX-RXM-PMREQ backup+force as the last I2C traffic so the chip drops to ~µA
	; software-backup during ESP deep sleep, and SDA/SCL are left hi-Z (any edge
	; would wake it back to ~25 mA tracking). 0 = GNSS on switched VDD1 rail.
	-DGNSS_POWER_PERMANENT=1
	; EXTINT hot-start wake (PCB reworked 2026-06-19): EXTINT (U15-5) cut from the antenna-
	; supervisor U16-Y1 and wired to ESP GPIO38. Firmware holds it idle LOW through deep sleep
	; (arms EXTINT0 in PMREQ) and pulses it HIGH to hot-start-wake without clearing BBR.
	-DGNSS_EXTINT_WAKE=1
	-DGNSS_WAKE_PIN=38
	; TEMPORARY (bench): PIR is physically disconnected, so its GPIO10 input floats and the
	; EXT1 ANY_HIGH wake fires within seconds, churning the device and ruining sleep-current
	; measurements. Disable EXT1/PIR wake for the test. Remove (default is 1) once the PIR is
	; reconnected, or tie GPIO10 to GND externally instead.
	-DPIR_WAKE_ENABLE=1
	; TEMPORARY (bench): skip modem registration/telemetry/OTA so the device goes GNSS->sleep
	; fast for a clean GNSS sleep-current measurement. REMOVE to test the modem / for deployment.
	-DBENCH_SKIP_UPLINK=0
	-DCORE_DEBUG_LEVEL=5
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MSC_ON_BOOT=0
	-DCONFIG_SPIRAM_USE_MALLOC=1
	-DCONFIG_SPIRAM_CACHE_WORKAROUND=1
	-DCONFIG_SPIRAM_USE_MALLOC_ALWAYS=1
	-DCONFIG_SPIRAM_MEMTEST=0
	-DCONFIG_SPIRAM_SPEED_80M=1
	-Ilib/deploy
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = 
board_build.arduino.ldscript = esp32s3_out.ld
board_upload.maximum_ram_size = 8388608
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_ota_16mb.csv